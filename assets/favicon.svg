<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cc"/>
      <stop offset="25%" stop-color="#f0d78c"/>
      <stop offset="60%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#99771f"/>
    </linearGradient>
    <linearGradient id="borderGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a6916"/>
      <stop offset="50%" stop-color="#f0d78c"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#d4af37" flood-opacity="0.45"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;display=swap');
      .logo-script {
        font-family: 'Great Vibes', 'Segoe Script', 'Brush Script MT', cursive;
        font-size: 34px;
        font-weight: 500;
        fill: url(#goldGradient);
      }
      .tag-text {
        font-family: 'Poppins', 'Segoe UI', sans-serif;
        font-size: 7px;
        font-weight: 600;
        letter-spacing: 1.8px;
        fill: #f0d78c;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Luxury dark squircle background -->
  <rect width="128" height="128" rx="28" fill="#0c0c0c"/>
  <rect x="3" y="3" width="122" height="122" rx="25" fill="none" stroke="url(#borderGradient)" stroke-width="2.5" opacity="0.9"/>
  <rect x="6.5" y="6.5" width="115" height="115" rx="22" fill="none" stroke="#d4af37" stroke-width="0.75" opacity="0.35"/>

  <!-- Crown perched on top of the 'N' -->
  <g transform="translate(18, 20) scale(0.6)" filter="url(#goldGlow)">
    <path d="M 4 22 L 8 8 L 16 16 L 24 4 L 32 16 L 40 8 L 44 22 Z" fill="url(#goldGradient)"/>
    <circle cx="8" cy="7" r="2.2" fill="#fff9e6"/>
    <circle cx="24" cy="3" r="2.5" fill="#fff9e6"/>
    <circle cx="40" cy="7" r="2.2" fill="#fff9e6"/>
    <circle cx="16" cy="15" r="1.5" fill="#fff9e6"/>
    <circle cx="32" cy="15" r="1.5" fill="#fff9e6"/>
    <rect x="4" y="22" width="40" height="3.5" rx="1.5" fill="url(#goldGradient)"/>
  </g>

  <!-- Sparkle top-right -->
  <path d="M 108 24 Q 108 29 113 29 Q 108 29 108 34 Q 108 29 103 29 Q 108 29 108 24 Z" fill="url(#goldGradient)" opacity="0.85"/>

  <!-- "Ninnah" in cursive script matching .logo-script -->
  <text x="56" y="75" text-anchor="middle" class="logo-script" filter="url(#goldGlow)">Ninnah</text>

  <!-- Heart outline beside the 'h' -->
  <g transform="translate(104, 56) rotate(12) scale(0.65)" filter="url(#goldGlow)">
    <path d="M 0 3.5 C -1 1.5, -4 0, -6.5 0 C -10.5 0, -13 3, -13 7 C -13 12.5, -4 17.5, 0 21 C 4 17.5, 13 12.5, 13 7 C 13 3, 10.5 0, 6.5 0 C 4 0, 1 1.5, 0 3.5 Z" 
          fill="none" stroke="url(#goldGradient)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom divider & tag -->
  <path d="M 22 91 L 49 91 M 79 91 L 106 91" stroke="url(#goldGradient)" stroke-width="0.75" opacity="0.5"/>
  <polygon points="64,88.5 66.5,91 64,93.5 61.5,91" fill="url(#goldGradient)" opacity="0.8"/>
  <text x="64" y="104" text-anchor="middle" class="tag-text" opacity="0.9">ERRANDS &amp; JEWELLERY</text>
</svg>
