<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Deep Onyx Black Gradient for left pillar -->
    <linearGradient id="blackStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Vibrant Emerald Green Gradient for main diagonal -->
    <linearGradient id="greenStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="25%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Crisp White Gradient for right pillar -->
    <linearGradient id="whiteStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Dual drop shadow for high contrast on light & dark browser tabs -->
    <filter id="tabShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g filter="url(#tabShadow)">
    <!-- Left Pillar: Black (with subtle light edge for dark-mode tabs) -->
    <rect x="8" y="8" width="22" height="84" rx="11" fill="url(#blackStem)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="0.8"/>

    <!-- Left Fold Shadow -->
    <path d="M 8,19 L 30,44.9 L 30,52 L 8,26 Z" fill="#000000" opacity="0.35"/>

    <!-- Right Pillar: White (with subtle contour for light-mode tabs) -->
    <rect x="70" y="8" width="22" height="84" rx="11" fill="url(#whiteStem)" stroke="#cbd5e1" stroke-width="0.8"/>

    <!-- Right Fold Shadow (cast onto white pillar) -->
    <path d="M 70,55.1 L 92,81 L 92,74 L 70,48 Z" fill="#000000" opacity="0.22"/>

    <!-- Main Diagonal: Emerald Green (Gmail ribbon style) -->
    <path d="M 8,19 A 11,11 0 0,1 19,8 L 30,8 L 92,81 A 11,11 0 0,1 81,92 L 70,92 Z" fill="url(#greenStem)"/>

    <!-- Sleek Top Highlight along the green ribbon -->
    <path d="M 19,9.5 L 29,9.5 L 89,80" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
  </g>
</svg>
