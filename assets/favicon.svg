<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Rich Gold Gradient for the main diagonal -->
    <linearGradient id="goldStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="20%" stop-color="#fcc419"/>
      <stop offset="60%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <!-- Emerald Green Gradient for left pillar -->
    <linearGradient id="greenStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Fashion Pink Gradient for right pillar -->
    <linearGradient id="pinkStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="45%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Overall drop shadow for visibility on both light and dark browser tabs -->
    <filter id="tabShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#tabShadow)">
    <!-- Left Pillar: Emerald Green -->
    <rect x="8" y="8" width="22" height="84" rx="11" fill="url(#greenStem)"/>

    <!-- Left Fold Shadow (under diagonal) -->
    <path d="M 8,19 L 30,44.9 L 30,52 L 8,26 Z" fill="#000000" opacity="0.22"/>

    <!-- Right Pillar: Vibrant Pink -->
    <rect x="70" y="8" width="22" height="84" rx="11" fill="url(#pinkStem)"/>

    <!-- Right Fold Shadow (under diagonal) -->
    <path d="M 70,55.1 L 92,81 L 92,74 L 70,48 Z" fill="#000000" opacity="0.22"/>

    <!-- Large Gold Diagonal (Gmail ribbon style) -->
    <path d="M 8,19 A 11,11 0 0,1 19,8 L 30,8 L 92,81 A 11,11 0 0,1 81,92 L 70,92 Z" fill="url(#goldStem)"/>

    <!-- Subtle Gold Highlight along top edge -->
    <path d="M 19,9.5 L 29,9.5 L 89,80" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
